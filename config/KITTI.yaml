common:
  img_topic: "/kitti/camera_color_left/image_raw"
  lid_topic: "/kitti/velo/pointcloud"
  imu_topic: "/kitti/oxts/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [-0.8086759, 0.3195559, -0.7997231]
  extrinsic_R: [0.9999976,  0.0007553, -0.0020358,
               -0.0007854,  0.9998898, -0.0148229,
                0.0020244,  0.0148245,  0.9998881]
  Rcl: [0.0103770, -0.9999336, -0.0046996,
        0.0147846,  0.0048526, -0.9998791,
        0.9998366,  0.0103087,  0.0148324] 
  Pcl: [0.0559890, -0.0755406, -0.2746054]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 2 # 2是VELO16，kitti是Velodyne HDL-64E
  scan_line: 64
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

lru:
  # use_voxel_lru: true
  voxel_capacity: 5000
  # use_vio_lru: true
  vio_capacity: 5000

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "kitti_2011_09_26_drive_0009_synced"
  pose_output_en: true

pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1